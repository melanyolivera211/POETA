# ==============================================================================
# POETA: Agente Persistente de Creación Literaria Autónoma
# Blueprint de Despliegue en Render (render.yaml)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # SERVICIO 1: poeta-api (Servidor Web HTTP + API REST + Dashboard HTML)
  # ----------------------------------------------------------------------------
  - type: web
    name: poeta-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/agent/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DISPLAY_TIMEZONE
        value: America/Bogota
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_TIMEOUT_SECONDS
        value: "60"
      - key: GEMINI_MAX_RETRIES
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # SERVICIO 2: poeta-worker (Background Worker Autónomo con APScheduler)
  # ----------------------------------------------------------------------------
  - type: worker
    name: poeta-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DISPLAY_TIMEZONE
        value: America/Bogota
      - key: WORKER_POLL_SECONDS
        value: "15"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_TIMEOUT_SECONDS
        value: "60"
      - key: GEMINI_MAX_RETRIES
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
