# ==============================================================================
# POETA: Agente Persistente de Creación Literaria Autónoma
# Blueprint de Despliegue en Render (render.yaml)
# ==============================================================================
# IMPORTANTE SOBRE PLANES Y COSTOS EN RENDER:
# 1. `poeta-api` (type: web): Render ofrece un plan `free` (se suspende tras 15 min
#    sin tráfico HTTP) o `starter` ($7 USD/mes, siempre activo).
# 2. `poeta-worker` (type: worker): Render NO ofrece un plan gratuito para
#    Background Workers. Requiere como mínimo el plan `starter` ($7 USD/mes).
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # SERVICIO 1: poeta-api (Servidor Web HTTP + API REST + Dashboard HTML)
  # ----------------------------------------------------------------------------
  - type: web
    name: poeta-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/agent/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DISPLAY_TIMEZONE
        value: America/Bogota
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/api
      - key: OLLAMA_MODEL
        value: gemma3:27b
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "60"
      - key: OLLAMA_MAX_RETRIES
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # SERVICIO 2: poeta-worker (Background Worker Autónomo con APScheduler)
  # ----------------------------------------------------------------------------
  - type: worker
    name: poeta-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DISPLAY_TIMEZONE
        value: America/Bogota
      - key: WORKER_POLL_SECONDS
        value: "15"
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/api
      - key: OLLAMA_MODEL
        value: gemma3:27b
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "60"
      - key: OLLAMA_MAX_RETRIES
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
